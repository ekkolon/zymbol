name: CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "**"
      - "!**/*.md"
      - "docs/reference/api.md"
  push:
    branches:
      - main
    paths:
      - "**"
      - "!**/*.md"
      - "docs/reference/api.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.repository.private == false) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0

      - name: Format
        run: zig fmt --check build.zig src tests examples benchmarks

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/check_pr_title.py "$PR_TITLE"

      - name: Check API docs
        run: python3 tools/check_api_docs.py

      - name: Test tools
        run: |
          python3 tools/test_api_docs.py
          python3 tools/test_release_tools.py

      - name: Test package contents
        run: python3 tools/test_package_layout.py

  linux:
    needs: preflight
    name: Linux / Zig 0.17.0
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0

      - name: Qualify
        run: zig build qualify

      - name: Consumer smoke
        working-directory: tests/consumer
        run: zig build test

      - name: Package smoke
        shell: bash
        run: |
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            archive_dir="$(mktemp -d)"
            archive="$archive_dir/zymbol.tar.gz"
            git archive --format=tar.gz --prefix="zymbol-$GITHUB_SHA/" --output="$archive" "$GITHUB_SHA"

            python3 -m http.server 8765 --bind 127.0.0.1 --directory "$archive_dir" >"$RUNNER_TEMP/zymbol-package-server.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            sleep 1

            python3 tools/package_smoke.py "http://127.0.0.1:8765/zymbol.tar.gz"
          else
            python3 tools/package_smoke.py "https://github.com/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          fi

  host:
    needs:
      - preflight
      - linux
    name: ${{ matrix.os }} / Zig 0.17.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0

      - name: Test
        run: zig build test

      - name: Consumer smoke
        working-directory: tests/consumer
        run: zig build test

  validation:
    needs:
      - preflight
      - linux
    name: Validation / Zig 0.17.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0

      - name: Install QEMU
        timeout-minutes: 5
        uses: ./.github/actions/setup-qemu

      - name: Runtime portability
        run: zig build runtime-portability -fqemu

      - name: Validate PNG
        run: zig build png-validate

      - name: Validate SVG
        run: zig build svg-validate
