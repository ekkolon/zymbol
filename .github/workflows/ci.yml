name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Zig ${{ matrix.zig }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        zig:
          - 0.16.0
          - 0.17.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.zig }}

      - name: Qualify
        run: zig build qualify

      - name: Consumer smoke
        working-directory: tests/consumer
        run: zig build test

  host:
    name: ${{ matrix.os }} / Zig 0.17.0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Test
        run: zig build test

      - name: Consumer smoke
        working-directory: tests/consumer
        run: zig build test

  validation:
    name: Validation / Zig 0.17.0
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user

      - name: Format
        run: zig fmt --check build.zig src tests examples benchmarks

      - name: Check API docs
        run: python3 tools/check_api_docs.py

      - name: Runtime portability
        run: zig build runtime-portability -fqemu

      - name: Validate PNG
        run: zig build png-validate

      - name: Validate SVG
        run: zig build svg-validate
