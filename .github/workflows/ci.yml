name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Linux / Zig ${{ matrix.zig }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        zig:
          - 0.16.0
          - 0.17.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          version="${{ matrix.zig }}"
          case "$version" in
            0.16.0) sha256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00" ;;
            0.17.0) sha256="1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026" ;;
            *) echo "unsupported Zig version: $version" >&2; exit 1 ;;
          esac
          archive="zig-x86_64-linux-${version}.tar.xz"
          curl --fail --location --silent --show-error             --output "$archive"             "https://ziglang.org/download/${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum --check -
          tar -xJf "$archive"
          echo "$PWD/zig-x86_64-linux-${version}" >> "$GITHUB_PATH"

      - name: Qualify
        run: zig build qualify

      - name: Consumer smoke
        working-directory: tests/consumer
        run: zig build test

  host:
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: ${{ matrix.os }} / Zig 0.17.0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "0.17.0"
          if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") {
            $arch = "aarch64"
            $sha256 = "0a59d91fa1cb40cf068e9b0954434ce973500c7a2ea749f1e01af62cdab52d26"
          } else {
            $arch = "x86_64"
            $sha256 = "b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428"
          }
          $archive = "zig-$arch-windows-$version.zip"
          $url = "https://ziglang.org/download/$version/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) {
            throw "Zig SHA-256 mismatch: expected $sha256, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath .
          (Resolve-Path "zig-$arch-windows-$version").Path |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Zig
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="0.17.0"
          case "$(uname -m)" in
            arm64)
              arch="aarch64"
              sha256="b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a"
              ;;
            x86_64)
              arch="x86_64"
              sha256="4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6"
              ;;
            *)
              echo "unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="zig-${arch}-macos-${version}.tar.xz"
          curl --fail --location --silent --show-error             --output "$archive"             "https://ziglang.org/download/${version}/${archive}"
          echo "${sha256}  ${archive}" | shasum -a 256 --check
          tar -xJf "$archive"
          echo "$PWD/zig-${arch}-macos-${version}" >> "$GITHUB_PATH"

      - name: Test
        run: zig build test

      - name: Consumer smoke
        working-directory: tests/consumer
        run: zig build test

  validation:
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: Validation / Zig 0.17.0
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          version="0.17.0"
          sha256="1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
          archive="zig-x86_64-linux-${version}.tar.xz"
          curl --fail --location --silent --show-error             --output "$archive"             "https://ziglang.org/download/${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum --check -
          tar -xJf "$archive"
          echo "$PWD/zig-x86_64-linux-${version}" >> "$GITHUB_PATH"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user

      - name: Format
        run: zig fmt --check build.zig src tests examples benchmarks

      - name: Check API docs
        run: python3 tools/check_api_docs.py

      - name: Runtime portability
        run: zig build runtime-portability -fqemu

      - name: Validate PNG
        run: zig build png-validate

      - name: Validate SVG
        run: zig build svg-validate
