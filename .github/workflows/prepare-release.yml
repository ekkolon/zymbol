name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit version; required for the initial v1 release
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    name: Prepare release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --tags --force

      - name: Prepare metadata
        id: prepare
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [[ -n "$REQUESTED_VERSION" ]]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          python3 tools/prepare_release.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Create or update release PR
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C release/next
          git add CHANGELOG.md README.md build.zig.zon docs/distribution.md
          git commit -m "release: prepare Zymbol v$VERSION"

          git fetch origin release/next:refs/remotes/origin/release/next || true
          git push --force-with-lease origin HEAD:release/next

          title="release: Zymbol v$VERSION"
          body="$(printf '%s\n\n%s' \
            "Automated release candidate for Zymbol v$VERSION." \
            "This PR is intentionally kept as a draft while changes accumulate. Mark it ready to run normal CI, then merge it to trigger the full release validation pipeline. A public repository publishes only after every release gate passes. The same pipeline can be run manually with publishing disabled while the repository is private.")"

          number="$(gh pr list --head release/next --base main --state open --json number --jq '.[0].number // empty')"

          if [[ -z "$number" ]]; then
            gh pr create --head release/next --base main --draft --title "$title" --body "$body"
          else
            gh pr edit "$number" --title "$title" --body "$body"
            gh pr ready "$number" --undo || true
          fi
