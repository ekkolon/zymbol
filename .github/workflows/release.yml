name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validation; keep false for a dry run
        required: true
        default: false
        type: boolean
  pull_request:
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          startsWith(github.event.pull_request.head.ref, 'release/v') &&
          startsWith(github.event.pull_request.title, 'release: Zymbol v') &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    name: Validate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.17.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: false

      - name: Resolve release identity
        shell: bash
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          tag="$(python3 tools/release.py --print-manifest-tag)"
          sha="$(git rev-parse HEAD)"

          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "${{ github.event.repository.private }}" == "false" ]]; then
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" ]]; then
            if [[ "${{ github.event.repository.private }}" == "true" ]]; then
              echo "::error::A private dry run cannot publish a stable release."
              exit 1
            fi
            publish=true
          fi

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "PUBLISH_RELEASE=$publish" >> "$GITHUB_ENV"

      - name: Validate release metadata
        run: python3 tools/release.py "$RELEASE_TAG" --notes-out release-notes.md

      - name: Repository checks
        shell: bash
        run: |
          git diff --check
          zig fmt --check build.zig src tests examples benchmarks
          python3 tools/check_api_docs.py
          python3 tools/test_release_tools.py

      - name: Consumer smoke
        working-directory: tests/consumer
        run: zig build test

      - name: Package smoke
        shell: bash
        run: |
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            archive_dir="$(mktemp -d)"
            archive="$archive_dir/zymbol.tar.gz"

            git archive \
              --format=tar.gz \
              --prefix="zymbol-$RELEASE_SHA/" \
              --output="$archive" \
              "$RELEASE_SHA"

            python3 -m http.server \
              8765 \
              --bind 127.0.0.1 \
              --directory "$archive_dir" \
              >"$RUNNER_TEMP/zymbol-package-server.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            sleep 1

            python3 tools/package_smoke.py \
              "http://127.0.0.1:8765/zymbol.tar.gz"
          else
            python3 tools/package_smoke.py \
              "https://github.com/$GITHUB_REPOSITORY/archive/$RELEASE_SHA.tar.gz"
          fi

      - name: Install QEMU
        timeout-minutes: 5
        uses: ./.github/actions/setup-qemu

      - name: Qualify
        run: zig build qualify

      - name: Runtime portability
        run: zig build runtime-portability -fqemu

      - name: Validate PNG
        run: zig build png-validate

      - name: Validate SVG
        run: zig build svg-validate

      - name: Benchmark
        run: zig build benchmark

      - name: Deterministic fuzz replay
        run: zig build fuzz

      - name: ZXing interoperability
        run: zig build interop

      - name: Create release tag
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi

          echo "RELEASE_TAG_CLEANUP=true" >> "$GITHUB_ENV"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$RELEASE_SHA" \
            >/dev/null

          actual="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.sha')"

          if [[ "$actual" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag points to $actual instead of $RELEASE_SHA."
            exit 1
          fi

      - name: Validate canonical tag archive
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..5}; do
            if python3 tools/package_smoke.py \
              "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$RELEASE_TAG.tar.gz"; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::Canonical tag archive failed package validation."
          exit 1

      - name: Create draft GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi

          echo "RELEASE_DRAFT_CLEANUP=true" >> "$GITHUB_ENV"

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Zymbol $RELEASE_TAG" \
            --notes-file release-notes.md

      - name: Clean up failed release preparation
        if: failure() && env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${RELEASE_DRAFT_CLEANUP:-false}" == "true" ]]; then
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes || true
          fi

          if [[ "${RELEASE_TAG_CLEANUP:-false}" == "true" ]]; then
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              >/dev/null 2>&1 || true
          fi

      - name: Publish immutable GitHub Release
        if: success() && env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft=false \
            --latest

      - name: Verify immutable release state
        if: success() && env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          actual="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.sha')"
          immutable="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.immutable')"
          draft="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.draft')"

          if [[ "$actual" != "$RELEASE_SHA" ]]; then
            echo "::error::Published tag points to $actual instead of $RELEASE_SHA."
            exit 1
          fi

          if [[ "$draft" != "false" || "$immutable" != "true" ]]; then
            echo "::error::Published release is not immutable."
            exit 1
          fi

      - name: Verify GitHub release attestation
        if: success() && env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            sleep 5
          done

          echo "::error::No valid GitHub release attestation was found."
          exit 1
