name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.repository.private == false }}
    name: Validate and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          version="0.17.0"
          sha256="1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
          archive="zig-x86_64-linux-${version}.tar.xz"
          curl --fail --location --silent --show-error             --output "$archive"             "https://ziglang.org/download/${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum --check -
          tar -xJf "$archive"
          echo "$PWD/zig-x86_64-linux-${version}" >> "$GITHUB_PATH"

      - name: Validate release metadata
        run: python3 tools/release.py "${GITHUB_REF_NAME}" --notes-out release-notes.md

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user python3-venv

      - name: Format
        run: zig fmt --check build.zig src tests examples benchmarks

      - name: Check API docs
        run: python3 tools/check_api_docs.py

      - name: Qualify
        run: zig build qualify

      - name: Runtime portability
        run: zig build runtime-portability -fqemu

      - name: Validate PNG
        run: zig build png-validate

      - name: Validate SVG
        run: zig build svg-validate

      - name: Consumer smoke
        working-directory: tests/consumer
        run: zig build test

      - name: Remote package smoke
        run: |
          python3 tools/package_smoke.py "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"

      - name: ZXing interoperability
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r tests/interop-requirements.txt
          zig build interop -Dpython=.venv/bin/python

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
