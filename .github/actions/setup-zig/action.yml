name: Setup Zig
description: Install a pinned Zig release from ziglang.org

inputs:
  version:
    description: Zig release version
    required: false
    default: 0.17.0

runs:
  using: composite
  steps:
    - name: Install Zig on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.version }}"
        if [[ "$version" != "0.17.0" ]]; then
          echo "unsupported Zig version: $version" >&2
          exit 1
        fi
        sha256="1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"

        archive="zig-x86_64-linux-${version}.tar.xz"
        curl --fail --location --silent --show-error \
          --output "$archive" \
          "https://ziglang.org/download/${version}/${archive}"
        echo "${sha256}  ${archive}" | sha256sum --check -
        tar -xJf "$archive"
        echo "$PWD/zig-x86_64-linux-${version}" >> "$GITHUB_PATH"

    - name: Install Zig on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.version }}"
        if [[ "$version" != "0.17.0" ]]; then
          echo "unsupported macOS Zig version: $version" >&2
          exit 1
        fi

        case "$(uname -m)" in
          arm64)
            arch="aarch64"
            sha256="b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a"
            ;;
          x86_64)
            arch="x86_64"
            sha256="4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6"
            ;;
          *)
            echo "unsupported macOS architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        archive="zig-${arch}-macos-${version}.tar.xz"
        curl --fail --location --silent --show-error \
          --output "$archive" \
          "https://ziglang.org/download/${version}/${archive}"
        echo "${sha256}  ${archive}" | shasum -a 256 --check
        tar -xJf "$archive"
        echo "$PWD/zig-${arch}-macos-${version}" >> "$GITHUB_PATH"

    - name: Install Zig on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = "${{ inputs.version }}"
        if ($version -ne "0.17.0") {
          throw "unsupported Windows Zig version: $version"
        }

        if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") {
          $arch = "aarch64"
          $sha256 = "0a59d91fa1cb40cf068e9b0954434ce973500c7a2ea749f1e01af62cdab52d26"
        } else {
          $arch = "x86_64"
          $sha256 = "b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428"
        }

        $archive = "zig-$arch-windows-$version.zip"
        Invoke-WebRequest `
          -Uri "https://ziglang.org/download/$version/$archive" `
          -OutFile $archive
        $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
        if ($actual -ne $sha256) {
          throw "Zig SHA-256 mismatch: expected $sha256, got $actual"
        }

        Expand-Archive -Path $archive -DestinationPath .
        (Resolve-Path "zig-$arch-windows-$version").Path |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
